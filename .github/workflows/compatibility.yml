name: Compatibilita Android e caratteri
on:
  push:
    branches: [main, codex/proiezione-e-compatibilita]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'build.gradle'
      - '.github/workflows/compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK e test
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          for test in tests/test_*.js; do node "$test"; done
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  devices:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            pixels: 720x1280
            density: 360
            font: '1.0'
          - api: 30
            pixels: 1080x1920
            density: 420
            font: '1.3'
          - api: 35
            pixels: 1080x1920
            density: 540
            font: '2.0'
          - api: 36
            pixels: 1200x1920
            density: 320
            font: '1.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-apks
          path: compatibility-apks
      - name: Accelerazione emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android ${{ matrix.api }} font ${{ matrix.font }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.pixels }}
            adb shell wm density ${{ matrix.density }}
            adb shell settings put system font_scale ${{ matrix.font }}
            adb install -r compatibility-apks/debug/app-debug.apk
            adb install -r compatibility-apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e compatibility true com.costoluce.cloud.test/com.costoluce.importatore.WidgetSmokeTestRunner | tee compatibility.txt
            mkdir -p evidence
            for file in $(adb shell run-as com.costoluce.cloud ls files/compat | tr -d '\r'); do adb exec-out run-as com.costoluce.cloud cat files/compat/$file > evidence/$file; done
            grep -q 'PASS: compatibility API' compatibility.txt
            if grep -q 'FAIL:' compatibility.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api }}-font-${{ matrix.font }}
          path: |
            compatibility.txt
            evidence/*
