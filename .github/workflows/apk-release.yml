name: Costo Luce - APK 6.0.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apk-release.yml"
      - "app/**"
      - "tests/**"
      - "build.gradle"
      - "settings.gradle"
  workflow_dispatch:

permissions:
  contents: write

# Avoid competing releases after multiple rapid pushes.
concurrency:
  group: costoluce-apk-v6-0-0
  cancel-in-progress: true

jobs:
  compile-and-publish:
    name: Compila, verifica e pubblica APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verifica test JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            tests/test_calculations.js \
            tests/test_import.js \
            tests/test_capture.js \
            tests/test_navigation.js \
            tests/test_monthly.js \
            tests/test_widget.js \
            tests/test_widget_wiring.js; do
            echo "TEST: $test"
            node "$test"
          done

      # Reuse this testing certificate on subsequent builds. A previous 5.x private key,
      # if available, can be supplied in the repository secret below for compatible updates.
      - name: Ripristina firma APK di test
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: costoluce-debug-signing-v1
      - name: Firma precedente opzionale
        env:
          PREVIOUS_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PREVIOUS_KEYSTORE" ]; then
            mkdir -p ~/.android
            printf '%s' "$PREVIOUS_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          fi
      - name: Test e compilazione Android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Abilita accelerazione emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test Android e layout RemoteViews
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p dist
            adb exec-out run-as com.costoluce.cloud cat files/screenshots/app-6.0.png > dist/app-6.0.png
            adb exec-out run-as com.costoluce.cloud cat files/screenshots/widget-summary-6.0.png > dist/widget-summary-6.0.png
            adb exec-out run-as com.costoluce.cloud cat files/screenshots/widget-history-6.0.png > dist/widget-history-6.0.png
            test -s dist/widget-history-6.0.png
      - name: Controllo APK e widget Android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > manifest-compiled.txt
          "$AAPT" dump permissions "$APK" > permissions-compiled.txt
          grep -q "CostoLuceWidgetProvider" manifest-compiled.txt
          grep -q "WidgetUpdateJobService" manifest-compiled.txt
          if grep -q "WidgetRefreshActivity" manifest-compiled.txt; then
            echo "ERRORE: l'Activity del vecchio pulsante non deve essere registrata" >&2
            exit 1
          fi
          grep -q "android.permission.ACCESS_NETWORK_STATE" permissions-compiled.txt
          grep -q "android.permission.INTERNET" permissions-compiled.txt
          mkdir -p dist
          cp "$APK" dist/CostoLuce_v6.0.0_NavyTeal_S25.apk
          sha256sum dist/CostoLuce_v6.0.0_NavyTeal_S25.apk

      # Release directly after the build. No emulator or upload-artifact dependency.
      - name: Pubblica APK su GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v6.0.0"
          APK="dist/CostoLuce_v6.0.0_NavyTeal_S25.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" dist/*.png --clobber
          else
            gh release create "$TAG" "$APK" dist/*.png \
              --target "$GITHUB_SHA" \
              --title "Costo Luce v6.0.0 - Navy e teal, storico Enel e widget a due pagine" \
              --notes "Widget navy/teal a due pagine con frecce/dot, storico di quattro mesi richiesto a Enel, mesi mancanti espliciti, corrente parziale. Toggle persistente euro/kWh condiviso con il widget. Bimestre ottobre-novembre e accisa mensile preservati. Refresh senza apertura app, anche periodico ogni circa sei ore secondo Android. Login e disponibilita storica da verificare sul dispositivo. Nessuna credenziale nel widget. APK di test: la firma precedente 5.x non e presente nel repository; la compatibilita di aggiornamento con 5.x non e garantita. NON disinstallare la vecchia app per forzare aggiornamento: Android eliminerebbe dati e credenziali." \
              --prerelease
          fi
          echo "### APK pubblicato" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/v6.0.0/CostoLuce_v6.0.0_NavyTeal_S25.apk" >> "$GITHUB_STEP_SUMMARY"
