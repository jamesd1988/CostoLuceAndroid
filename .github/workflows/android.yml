name: Android emulator (legacy - avvio manuale)

# Archived for optional emulator diagnostics. APK compiled by apk-release.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Scarica i sorgenti
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK preinstallato sul runner
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: SDK Android 35
        run: |
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test logica JavaScript
        run: |
          node tests/test_calculations.js
          node tests/test_import.js
          node tests/test_capture.js
          node tests/test_navigation.js
          node tests/test_monthly.js
          node tests/test_widget.js
          node tests/test_widget_wiring.js
      - name: Compilazione ufficiale Android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verifica presenza APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          # Verify widget registration in the generated manifest
          $ANDROID_HOME/build-tools/35.0.0/aapt dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml | grep -q 'CostoLuceWidgetProvider'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml | grep -q 'WidgetUpdateJobService'
          ! $ANDROID_HOME/build-tools/35.0.0/aapt dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml | grep -q 'WidgetRefreshActivity'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -q 'android.permission.ACCESS_NETWORK_STATE'
      - name: Rinomina APK con numero versione
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CostoLuce_v5.6.0_WidgetBackgroundRefresh_S25.apk
          test -s dist/CostoLuce_v5.6.0_WidgetBackgroundRefresh_S25.apk
      - name: Pubblica APK installabile
        uses: actions/upload-artifact@v4
        with:
          name: CostoLuce_v5.6.0_WidgetBackgroundRefresh_S25
          path: dist/CostoLuce_v5.6.0_WidgetBackgroundRefresh_S25.apk
          if-no-files-found: error
          retention-days: 30
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4
      - name: Scarica APK prodotto in CI
        uses: actions/download-artifact@v4
        with:
          name: CostoLuce_v5.6.0_WidgetBackgroundRefresh_S25
          path: ./apk
      - name: Emulatore Android - prova apertura
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r apk/CostoLuce_v5.6.0_WidgetBackgroundRefresh_S25.apk
            adb logcat -c
            adb shell am broadcast -n com.costoluce.cloud/com.costoluce.importatore.CostoLuceWidgetProvider -a com.costoluce.cloud.action.WIDGET_REFRESH
            sleep 2
            adb shell run-as com.costoluce.cloud cat shared_prefs/costoluce_widget_snapshot_v1.xml | grep -q 'refresh_status'
            adb shell am start -W -n com.costoluce.cloud/com.costoluce.importatore.MainActivity
            sleep 12
            adb logcat -d -v time > emulator-logcat.txt
            adb shell pidof com.costoluce.cloud > app-pid.txt || true
            test -s app-pid.txt || { echo "ERRORE: l'app non e' rimasta avviata"; exit 1; }
            if grep -A 30 'FATAL EXCEPTION' emulator-logcat.txt | grep -q 'Process: com.costoluce.cloud'; then echo 'ERRORE: crash AndroidRuntime'; exit 1; fi
            echo "OK: processo app attivo dopo 12 secondi"
      - name: Salva log diagnostici
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CostoLuce-emulator-log
          path: |
            emulator-logcat.txt
            app-pid.txt
          if-no-files-found: ignore
          retention-days: 14
