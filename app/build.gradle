plugins {
    id 'com.android.application'
}

android {
    namespace 'com.costoluce.importatore'
    compileSdk 35

    defaultConfig {
        // Nuovo ID: non va in conflitto con le APK sperimentali precedenti.
        applicationId 'com.costoluce.cloud'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '4.0-cloud-test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
