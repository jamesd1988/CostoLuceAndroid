plugins {
    id 'com.android.application'
}

android {
    namespace 'com.costoluce.importatore'
    compileSdk 35

    defaultConfig {
        // Nuovo ID: non va in conflitto con le APK sperimentali precedenti.
        applicationId 'com.costoluce.cloud'
        minSdk 24
        targetSdk 35
        versionCode 33
        versionName '6.9.1'
        testInstrumentationRunner 'com.costoluce.importatore.WidgetSmokeTestRunner'
    }

    signingConfigs {
        debug {
            def ciStore = System.getenv('COSTOLUCE_DEBUG_KEYSTORE')
            if (ciStore) storeFile file(ciStore)
            storePassword 'android'
            keyAlias 'AndroidDebugKey'
            keyPassword 'android'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Public source fixture is packaged only in the test APK, never in production data.
    sourceSets { androidTest.assets.srcDirs += ['src/test/resources'] }
}

// Test JVM: verifica raggruppamento dei dati orari in mesi solari.
dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

