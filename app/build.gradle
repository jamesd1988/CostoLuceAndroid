plugins {
    id 'com.android.application'
}

android {
    namespace 'com.costoluce.importatore'
    compileSdk 35

    defaultConfig {
        // Nuovo ID: non va in conflitto con le APK sperimentali precedenti.
        applicationId 'com.costoluce.cloud'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '5.6.0-widget-background-refresh'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Test JVM: verifica raggruppamento dei dati orari in mesi solari.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
