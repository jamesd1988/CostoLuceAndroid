plugins {
    id 'com.android.application'
}

android {
    namespace 'com.costoluce.importatore'
    compileSdk 35

    defaultConfig {
        // Nuovo ID: non va in conflitto con le APK sperimentali precedenti.
        applicationId 'com.costoluce.cloud'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '5.1.1-enel-diagnostica'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
